version: 2
updates:
  # Root lockfile (npm workspaces: also covers client/, which has no lockfile of its own)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # server/ has its own lockfile
  - package-ecosystem: npm
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  # Keeps the pinned action SHAs in .github/workflows current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
